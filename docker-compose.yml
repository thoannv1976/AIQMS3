# Local development services for AIQMS3.
# Usage: docker compose up -d   (then `npm run db:migrate` and `npm run db:seed`)
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: aiqms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aiqms
      POSTGRES_PASSWORD: aiqms_dev_pw
      POSTGRES_DB: aiqms
    ports:
      - "5432:5432"
    volumes:
      - aiqms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiqms -d aiqms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aiqms_pgdata:
